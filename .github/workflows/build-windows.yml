name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build PyInstaller bundle
        run: pyinstaller --clean --noconfirm packaging/windows/dashboard_atenciones.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\DashboardAtenciones.iss'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DashboardAtenciones-Setup
          path: installer/DashboardAtenciones-Setup.exe
